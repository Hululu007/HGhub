[package]
name = "hghub-hpp"
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
rquickjs = { version = "0.12.2", features = ["loader", "array-buffer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
wreq = { version = "6.0.0-rc.31", default-features = false, features = ["system-proxy", "socks", "gzip", "brotli", "json", "charset", "stream", "tokio-rt", "webpki-roots"] }
# wreq 本身只导出模拟结果类型（Emulation 结构体）；Chrome 等预设
# 档位在 wreq-util 的 Profile 枚举里（Profile 实现了 wreq::IntoEmulation），
# 所以要直引 wreq-util 才能点名 Chrome149。版本须与 wreq 锁定的
# wreq-util 3.0.0-rc.14 一致（wreq-util 依赖 wreq 6.0.0-rc）。
wreq-util = "3.0.0-rc.14"
url = "2"
base64 = "0.22"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
# 猫源 ZIP 导入：只支持 stored + deflate，其他压缩方式解压时报明错。
zip = { version = "2", default-features = false, features = ["deflate"] }
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
aes-gcm = "0.10"
rand = "0.8"
rsa = { version = "0.10", features = ["pkcs1v15"] }
# RSA 0.10 uses digest 0.11; keep the existing hash/HMAC adapters on 0.10.
rsa-sha1 = { package = "sha1", version = "0.11" }
dom_query = "0.28"
cookie = "0.18"
futures-util = "0.3"
axum = "0.7"
regex = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# rquickjs does not ship mobile bindings; generate them against the target SDK.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { version = "0.12.2", features = ["bindgen"] }

[target.'cfg(target_os = "ios")'.dependencies]
system-configuration = "0.7"
core-foundation = "0.9"
# iOS 系统代理设置仍由 proxy.rs 直接读 SCDynamicStoreCopyProxies；
# TLS 后端不再分平台：wreq 全平台都用 BoringSSL 做 Chrome 指纹模拟，
# v0.0.67 的 native-tls/rustls 分流已随 reqwest 一起去掉。

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
rquickjs-sys = { path = "../../vendor/rquickjs-sys" }

