[package]
name = "huangguo-client"
version = "0.0.4"
description = "HGhub · 插件视频播放器"
authors = ["HGhub"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "huangguo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# iOS 原生插件的 SwiftLinker 链接（build.rs 用）：build / build-2 都
# 提供 tauri_utils::build 模块，这里用 build-2，与 tauri-build 启用的
# 新版 html-manipulation 后端一致，避免多编一份。
tauri-utils = { version = "2", features = ["build-2"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 下载命令用：直连回环播放地址取流（与 hpp 共用 wreq + Chrome 指纹模拟；
# url 用于解析清单里的相对分片地址；bytes 用于给响应流写类型）。
wreq = { version = "6.0.0-rc.31", default-features = false, features = ["system-proxy", "socks", "gzip", "brotli", "json", "charset", "stream", "tokio-rt", "webpki-roots"] }
wreq-util = "3.0.0-rc.14"
bytes = "1"
url = "2"
time = { version = "0.3", features = ["formatting"] }
hghub-hpp = { path = "crates/hpp" }

tokio = { version = "1", features = ["sync", "fs", "io-util"] }

[target.'cfg(any(target_os = "windows", target_os = "android"))'.dependencies]
futures-util = "0.3"
tokio-util = "0.7"

# iOS 的 Python 引导（src/python.rs）用 BoxFuture；futures-util 只在
# windows/android 目标下声明过，iOS 构建在 v0.0.53 挂掉（E0433）。
# tokio-util 不需要：app 侧只在 android/windows 登录里用，hpp 自带一份。
[target.'cfg(target_os = "ios")'.dependencies]
futures-util = "0.3"
# v0.0.91：WebHome 的同步 Cookie 读改异步——直接调 WKHTTPCookieStore
# 的 getAllCookies（与 wry 的 cookies() 同款调用，但不用它那个在主线
# 程上转嵌套 run loop 的 wait_for_blocking_operation）。版本与 vendored
# wry 0.57.1 的 Cargo.toml 一致（objc2-web-kit 0.3.2、block2 0.6；
# objc2-foundation 0.3.2；objc2 0.6 与 macOS 侧同一版本）。
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
  "NSDate",
  "NSHTTPCookie",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "WKWebsiteDataStore",
  "WKWebsiteDataRecord",
  "WKHTTPCookieStore",
] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
wry = "0.57"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_SystemServices"] }
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
wry = { path = "vendor/wry" }

# macOS 红绿灯垂直居中需要读取 AppKit 按钮尺寸（见 src/macos_titlebar.rs）。
# 三者均已是 tao/wry 的间接依赖，版本与 Cargo.lock 一致；只开启用到的 feature。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

# Avoid invalid incremental object references on filesystems without hard links.
[profile.dev]
incremental = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
