[package]
name = "huangguo-client"
version = "0.0.4"
description = "HGhub · 插件视频播放器"
authors = ["HGhub"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "huangguo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# iOS 原生插件的 SwiftLinker 链接（build.rs 用）：build / build-2 都
# 提供 tauri_utils::build 模块，这里用 build-2，与 tauri-build 启用的
# 新版 html-manipulation 后端一致，避免多编一份。
tauri-utils = { version = "2", features = ["build-2"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-fs = "=2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 下载命令用：直连回环播放地址取流（reqwest 与 hpp 共用 0.12，TLS 后端
# 按目标分开：iOS 用 native-tls，其它平台用 rustls-tls，与 hpp 保持一致，
# 不能在同一个目标上同时开两个后端；url 用于解析清单里的相对分片地址）。
reqwest = { version = "0.12", default-features = false }
url = "2"
time = { version = "0.3", features = ["formatting"] }
hghub-hpp = { path = "crates/hpp" }

tokio = { version = "1", features = ["sync", "fs", "io-util"] }

[target.'cfg(any(target_os = "windows", target_os = "android"))'.dependencies]
futures-util = "0.3"
tokio-util = "0.7"

# iOS 的 Python 引导（src/python.rs）用 BoxFuture；futures-util 只在
# windows/android 目标下声明过，iOS 构建在 v0.0.53 挂掉（E0433）。
# tokio-util 不需要：app 侧只在 android/windows 登录里用，hpp 自带一份。
[target.'cfg(target_os = "ios")'.dependencies]
futures-util = "0.3"
# 与 hpp 一致：iOS 上 reqwest 用系统 TLS（native-tls）。
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
wry = "0.57"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_SystemServices"] }
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
wry = { path = "vendor/wry" }

# macOS 红绿灯垂直居中需要读取 AppKit 按钮尺寸（见 src/macos_titlebar.rs）。
# 三者均已是 tao/wry 的间接依赖，版本与 Cargo.lock 一致；只开启用到的 feature。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

# Avoid invalid incremental object references on filesystems without hard links.
[profile.dev]
incremental = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
